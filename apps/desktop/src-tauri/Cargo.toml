[package]
name = "open-browser-desktop"
description = "The open-browser desktop app: the service and the web UI in one window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
# Tauri builds the app as a library on mobile targets and links it from `main.rs` on desktop.
name = "open_browser_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# Named for the product rather than the package: Tauri bundles the binary whose name matches
# `productName`, and `open-browser-desktop` would leave it looking for one that does not exist.
name = "open-browser"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
anyhow.workspace = true
open-browser-core.workspace = true
open-browser-server.workspace = true
tauri = { workspace = true }
tauri-plugin-opener.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
